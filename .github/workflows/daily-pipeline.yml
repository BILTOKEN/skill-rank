name: Daily Pipeline

on:
  schedule:
    # UTC 00:17 = 北京时间 08:17（避开整点高峰期）
    - cron: '17 0 * * *'
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run pipeline
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: npm run pipeline

      - name: Commit and push data updates
        run: |
          set -e
          git config user.name "skill-rank-bot"
          git config user.email "bot@skill-rank.vercel.app"
          git add data/ -f
          if ! git diff --cached --quiet; then
            git commit -m "data: daily snapshot $(date +%Y-%m-%d)"
          fi
          # 拉取远端最新并 rebase，最多重试 3 次（解决并发推送冲突）
          for i in 1 2 3; do
            git fetch origin main && git rebase origin/main && git push origin main && exit 0
            echo "推送冲突，5秒后重试 ($i/3)..."
            sleep 5
          done
          echo "推送失败：3次重试后仍无法推送"
          exit 1

      - name: Build site
        run: npm run build

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
